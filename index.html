<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Estudio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor">
        <h1>📚 Diario de Estudio</h1>

        <!-- Saludo personalizado (según la preferencia del perfil) -->
        <p id="saludo" class="saludo oculto"></p>

        <!-- Acceso al perfil -->
        <button type="button" id="abrir-perfil" class="acceso-perfil">
            <span id="perfil-avatar-mini" class="avatar avatar-mini" aria-hidden="true">?</span>
            <span>Mi perfil</span>
        </button>

        <!-- Vista de perfil -->
        <section id="perfil" class="perfil oculto" aria-label="Perfil del usuario">
            <h2>Mi perfil</h2>

            <!-- Aviso de datos corruptos -->
            <div id="perfil-aviso" class="perfil-aviso oculto" role="alert">
                <p>No se pudieron leer tus datos de perfil. Se muestra el perfil por defecto.</p>
                <button type="button" id="perfil-reiniciar" class="boton-secundario">Reiniciar perfil</button>
            </div>

            <div class="perfil-cabecera">
                <span id="perfil-avatar" class="avatar" aria-hidden="true">?</span>
                <div class="perfil-nombre-col">
                    <label for="perfil-nombre">Nombre</label>
                    <input type="text" id="perfil-nombre" maxlength="40" placeholder="¿Cómo te llamas?" autocomplete="name">
                </div>
            </div>

            <fieldset class="perfil-color">
                <legend>Color de tu avatar</legend>
                <div id="perfil-paleta" class="paleta"></div>
            </fieldset>

            <label for="perfil-meta">Meta semanal (minutos)</label>
            <input type="text" id="perfil-meta" inputmode="numeric" autocomplete="off" placeholder="Sin meta">

            <div id="perfil-progreso" class="progreso oculto">
                <div class="progreso-barra" role="progressbar" id="progreso-barra" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <span id="progreso-relleno" class="progreso-relleno"></span>
                </div>
                <p id="progreso-texto" class="progreso-texto"></p>
            </div>

            <label class="perfil-saludo-toggle">
                <input type="checkbox" id="perfil-saludo">
                Mostrar saludo personalizado
            </label>

            <div class="perfil-acciones">
                <button type="button" id="perfil-guardar" class="boton-principal">Guardar perfil</button>
                <button type="button" id="perfil-borrar" class="boton-secundario">Borrar perfil</button>
            </div>
            <p id="perfil-mensaje" class="mensaje oculto"></p>
        </section>

        <!-- Racha actual -->
        <section class="racha">
            <span class="racha-numero" id="racha">0</span>
            <span class="racha-texto">días de racha 🔥</span>
        </section>

        <!-- Mejor racha -->
        <section class="mejor-racha">
            <span id="mejor-racha">🏆 Mejor racha: 0 días</span>
        </section>

        <!-- Estadísticas del periodo -->
        <div class="resumen">
            <!-- Total de la semana -->
            <section class="total-semana">
                <span id="total-semana">Esta semana: 0min</span>
            </section>

            <!-- Días estudiados este mes -->
            <section class="dias-mes">
                <span id="dias-mes">Este mes: 0 días</span>
            </section>
        </div>

        <!-- Mapa de calor de las últimas semanas -->
        <section class="mapa-calor">
            <h2>Últimas 12 semanas</h2>
            <div class="mapa-calor-caja">
                <div id="mapa-calor" class="mapa-rejilla" role="group" aria-label="Mapa de calor de días estudiados"></div>
                <p id="mapa-etiqueta" class="mapa-etiqueta oculto" aria-live="polite"></p>
                <p id="mapa-mensaje" class="mapa-mensaje oculto"></p>
                <div class="mapa-leyenda" aria-hidden="true">
                    <span>Menos</span>
                    <span class="mapa-dia nivel-0"></span>
                    <span class="mapa-dia nivel-1"></span>
                    <span class="mapa-dia nivel-2"></span>
                    <span class="mapa-dia nivel-3"></span>
                    <span class="mapa-dia nivel-4"></span>
                    <span>Más</span>
                </div>
            </div>
        </section>

        <!-- Formulario para registrar sesión -->
        <section class="formulario">
            <h2>Registrar sesión</h2>
            <form id="form-sesion">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" required>

                <label for="tema">Tema</label>
                <input type="text" id="tema" placeholder="¿Qué estudiaste?" required>

                <div class="tiempo-fila">
                    <div class="tiempo-col">
                        <label for="horas">Horas</label>
                        <input type="number" id="horas" min="0" value="0" placeholder="0">
                    </div>
                    <div class="tiempo-col">
                        <label for="minutos">Minutos</label>
                        <input type="number" id="minutos" min="0" max="59" value="0" placeholder="0">
                    </div>
                </div>

                <button type="submit" class="boton-principal">Guardar sesión</button>
            </form>
            <p id="mensaje" class="mensaje oculto"></p>
        </section>

        <!-- Lista de sesiones -->
        <section class="sesiones">
            <h2>Sesiones</h2>
            <ul id="lista-sesiones" class="lista-sesiones"></ul>
        </section>
    </div>

    <script src="heatmap.js"></script>
    <script src="profile.js"></script>
    <script src="app.js"></script>
</body>
</html>
